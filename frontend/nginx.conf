server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 210M;
  # Masque la version nginx exposée dans les headers Server et les pages d'erreur.
  server_tokens off;

  # Timeouts sur le proxy vers le backend — sans ça, un backend qui ne répond
  # plus laisse les connexions nginx ouvertes indéfiniment.
  proxy_connect_timeout 10s;
  proxy_read_timeout 60s;

  add_header X-Content-Type-Options nosniff always;
  # SAMEORIGIN et non DENY : la visionneuse PDF affiche les fichiers dans un
  # <iframe> pointant vers ce même domaine (proxié vers le backend) — DENY
  # casserait cet aperçu.
  add_header X-Frame-Options SAMEORIGIN always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml+rss;
  # Pas d'images/vidéos/audio dans gzip_types — déjà compressés, gzip
  # gaspillerait du CPU pour un gain nul voire négatif.

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    # Le nom de fichier physique inclut un horodatage + hash aléatoire et le
    # contenu ne change jamais une fois écrit (la détection de doublons rejette
    # tout re-upload du même contenu) — immutable et cache long sans risque.
    # "private" plutôt que "public" : l'accès passe par un token/clé dans
    # l'URL, on ne veut pas qu'un cache partagé (proxy, CDN) redistribue ça.
    # proxy_hide_header d'abord : res.sendFile() côté backend met déjà son
    # propre Cache-Control (public, max-age=0) — sans ça on se retrouve avec
    # deux headers Cache-Control contradictoires dans la même réponse.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
