# Dependabot : une fois par semaine (lundi 6 h), une PR par lot de mises à jour mineures, une PR par mise à jour majeure.
# Chaque PR passe par la CI (tests) avant d'être fusionnée ; les alertes de sécurité arrivent aussi par e-mail.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      npm-backend-mineures:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/frontend"
    ignore:
      # jsdom 31 casse la simulation d'envoi de fichiers dans tests/views/UploadView.spec.ts : à revoir avec ces tests
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      npm-frontend-mineures:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      github-actions-mineures:
        update-types: [minor, patch]
